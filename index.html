<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLearn AI Tutor - Quiz & Improvement Flow</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --primary-color: #0f766e;
      --primary-hover: #115e59;
      --text-color: #1f2937;
      --border-color: #e5e7eb;
      --chat-bg: #ffffff;
      --bot-bg: #f0fdf4;
      --user-bg: #0f766e;
      --user-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 20px;
      width: 100%;
      max-width: 1280px;
      height: 92vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* Column 1: Khu vực Slide có thể cuộn - ĐÃ BỎ TIÊU ĐỀ */
    .doc-section {
      padding: 20px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: #fafbfc;
      height: 100%;
      overflow: hidden;
    }

    .slides-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-right: 10px;
      scroll-behavior: smooth;
    }

    .slide-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: border-color 0.3s, background-color 0.3s;
    }

    .slide-card.highlight {
      border: 2px solid #ea580c;
      background-color: #fffaf0;
    }

    .slide-header {
      font-weight: 700;
      font-size: 1rem;
      color: var(--primary-color);
      border-bottom: 2px solid #f0fdf4;
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slide-number {
      font-size: 0.75rem;
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .slide-content {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #374151;
    }

    .slide-content ul {
      margin-left: 20px;
      margin-top: 8px;
    }

    .slide-content li {
      margin-bottom: 6px;
    }

    /* Column 2: Chat Section */
    .chat-section {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--chat-bg);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .chat-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header span {
      font-size: 0.85rem;
      color: #6b7280;
      font-weight: normal;
    }

    .btn-minimize {
      background: #f3f4f6;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-minimize:hover {
      background: #e5e7eb;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 88%;
      padding: 14px 18px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid #dcfce7;
      border-bottom-left-radius: 2px;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 2px;
    }

    .suggestions-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .suggestion-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-top: 5px;
    }

    .btn-suggestion {
      background: #fff;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 10px 14px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.4;
    }

    .btn-suggestion:hover {
      background: var(--primary-color);
      color: #fff;
    }

    .btn-test-action {
      background: #fff7ed;
      border: 1.5px dashed #ea580c;
      color: #c2410c;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 5px;
    }

    .btn-test-action:hover {
      background: #ea580c;
      color: #fff;
    }

    .btn-option {
      background: #fff;
      border: 1px solid #cbd5e1;
      color: #1e293b;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-option:hover {
      border-color: var(--primary-color);
      background: #f8fafc;
    }

    .btn-level-chat {
      background: #fff;
      border: 1.5px solid var(--primary-color);
      color: var(--primary-color);
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-right: 8px;
      margin-top: 8px;
      display: inline-block;
    }

    .btn-level-chat:hover {
      background: var(--primary-color);
      color: #fff;
    }

    .chat-input-area {
      padding: 15px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      background: #fff;
      flex-shrink: 0;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
    }

    .chat-input-area input:focus {
      border-color: var(--primary-color);
    }

    .btn-send {
      padding: 10px 20px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-send:hover {
      background: var(--primary-hover);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .badge-coban { background: #e0f2fe; color: #0369a1; }
    .badge-thongthao { background: #fef3c7; color: #b45309; }
    .badge-nangcao { background: #f3e8ff; color: #6b21a8; }
    .badge-tutor { background: #dcfce7; color: #15803d; }
    .badge-test { background: #ffedd5; color: #9a3412; }

    /* STATE: Thu nhỏ chat bot */
    .chat-section.minimized {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 280px;
      height: 55px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 1px solid var(--border-color);
      z-index: 100;
    }

    .chat-section.minimized .chat-messages,
    .chat-section.minimized .chat-input-area {
      display: none;
    }

    .container.chat-minimized {
      grid-template-columns: 1fr;
    }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    <!-- KHU VỰC 1: SLIDE BÀI HỌC (3 SLIDE CÓ THỂ CUỘN - KHÔNG CÓ TIÊU ĐỀ) -->
    <div class="doc-section">
      <div class="slides-container" id="slides-container">
        <div class="slide-card">
          <div class="slide-header">
            <span>Đang tải nội dung bài học...</span>
            <span class="slide-number">VLearn</span>
          </div>
          <div class="slide-content">
            <p>Slide được tải cục bộ từ backend để không đưa data pack riêng tư vào Git.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- KHU VỰC 2: KHUNG CHAT AI TUTOR -->
    <div class="chat-section" id="chat-section">
      <div class="chat-header">
        <div>VLearn AI Tutor</div>
        <div class="chat-header-actions">
          <span id="current-status-display">Trạng thái: Sẵn sàng</span>
          <button class="btn-minimize" id="btn-toggle-chat" onclick="toggleChat()">[-] Thu nhỏ</button>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <!-- AI sẽ tự gởi lời chào và khảo sát mức độ ngay lúc mở trang -->
      </div>

      <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Gõ câu hỏi của bạn tại đây..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="sendMessage()">Gửi</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:8000';
    let tutorSessionId = null;
    let currentLevelKey = 'coban';

    // Dữ liệu câu hỏi, câu trả lời, và ngân hàng câu hỏi test theo từng mức độ
    const knowledgeBase = {
      coban: {
        badgeClass: "badge-coban",
        label: "Cơ bản",
        questions: [
          "AI, Machine Learning, Deep Learning, GenAI và LLM khác nhau thế nào?",
          "Token là gì và vì sao model không đọc nguyên từng từ?",
          "Một problem statement một câu cần mô tả những gì?"
        ],
        answers: {},
        test: {
          question: "Theo bài Day 1, LLM nằm ở đâu trong hệ các khái niệm AI?",
          options: [
            "A. LLM là chiếc ô lớn nhất bao trùm toàn bộ AI",
            "B. LLM là model nền chuyên ngôn ngữ thuộc Generative AI",
            "C. LLM hoàn toàn không liên quan đến Deep Learning",
            "D. LLM chỉ là một tên gọi khác của chatbot"
          ],
          correctIndex: 1,
          slideTarget: "slide-D1-3",
          slideName: "Day 1 · Trang 3: Bức tranh AI, ML, Deep Learning, GenAI và LLM",
          feedbackWrong: "LLM là model nền chuyên ngôn ngữ trong hệ Generative AI; chatbot chỉ là một dạng sản phẩm được đóng gói quanh model nền."
        }
      },
      thongthao: {
        badgeClass: "badge-thongthao",
        label: "Thông thạo",
        questions: [
          "Context và attention giữ vai trò gì khi LLM xử lý câu hỏi?",
          "Từ LLM đến agent có những mức năng lực nào?",
          "Baseline, target và measurement liên hệ với nhau thế nào?"
        ],
        answers: {},
        test: {
          question: "Điểm khác biệt cốt lõi khi chuyển từ LLM sang agent là gì?",
          options: [
            "A. Agent chỉ đổi màu giao diện của chatbot",
            "B. Agent thêm khả năng dùng công cụ, nhớ trạng thái và lặp để đạt mục tiêu",
            "C. Agent không cần model ngôn ngữ",
            "D. Agent luôn chính xác và không cần kiểm soát"
          ],
          correctIndex: 1,
          slideTarget: "slide-D1-23",
          slideName: "Day 1 · Trang 23: Từ LLM đến agent",
          feedbackWrong: "Agent bổ sung năng lực hành động, công cụ, trạng thái và vòng lặp; điều đó không đồng nghĩa agent luôn đúng."
        }
      },
      nangcao: {
        badgeClass: "badge-nangcao",
        label: "Nâng cao",
        questions: [
          "Khi nào automate hoàn toàn rủi ro hơn augment?",
          "Vì sao nên chọn model theo tầng thay vì chỉ nhìn tên model?",
          "Temperature và top_p tạo ra những đánh đổi nào?"
        ],
        answers: {},
        test: {
          question: "Khi sai sót có hậu quả cao và cần con người kiểm tra, mức automation phù hợp nhất là gì?",
          options: [
            "A. Automate hoàn toàn mọi trường hợp",
            "B. Augment hoặc conditional automation với điểm kiểm soát của con người",
            "C. Luôn dùng agent tự chủ nhiều bước",
            "D. Bỏ toàn bộ bước đo lường"
          ],
          correctIndex: 1,
          slideTarget: "slide-D2-17",
          slideName: "Day 2 · Trang 17: Automate và Augment",
          feedbackWrong: "Khi cost-of-error cao, nên giữ quyền quyết định hoặc điểm kiểm soát cho con người thay vì tự động hóa hoàn toàn."
        }
      }
    };

    let isMinimized = false;

    window.onload = async function() {
      initChatTutor();
      await Promise.all([initBackendSession(), loadSlidesFromBackend()]);
    };

    async function loadSlidesFromBackend() {
      const container = document.getElementById('slides-container');
      try {
        const response = await fetch(`${API_BASE_URL}/api/slides`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        container.innerHTML = '';
        data.slides.forEach(slide => {
          const card = document.createElement('div');
          card.className = 'slide-card';
          card.id = `slide-${slide.document_id}-${slide.page}`;

          const header = document.createElement('div');
          header.className = 'slide-header';
          const title = document.createElement('span');
          title.textContent = slide.page_title;
          const number = document.createElement('span');
          number.className = 'slide-number';
          number.textContent = `${slide.citation} · ${slide.document_title}`;
          header.append(title, number);

          const content = document.createElement('div');
          content.className = 'slide-content';
          String(slide.content).split('\n').filter(Boolean).forEach(line => {
            const paragraph = document.createElement('p');
            paragraph.textContent = line;
            content.appendChild(paragraph);
          });
          card.append(header, content);
          container.appendChild(card);
        });
      } catch (error) {
        container.innerHTML = `
          <div class="slide-card">
            <div class="slide-header">
              <span>Không tải được slide</span>
              <span class="slide-number">Backend offline</span>
            </div>
            <div class="slide-content">
              <p>Hãy chạy backend và tải lại trang. Chi tiết: ${escapeHTML(error.message)}</p>
            </div>
          </div>
        `;
      }
    }

    async function initBackendSession() {
      const status = document.getElementById('current-status-display');
      status.innerText = 'Trạng thái: Đang kết nối AI...';
      try {
        const response = await fetch(`${API_BASE_URL}/api/sessions`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({initial_level: currentLevelKey})
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        tutorSessionId = data.session.session_id;
        status.innerText = 'Trạng thái: AI sẵn sàng';
      } catch (error) {
        status.innerText = 'Trạng thái: Chưa kết nối backend';
      }
    }

    function initChatTutor() {
      const chatMessages = document.getElementById('chat-messages');
      const botMessageDiv = document.createElement('div');
      botMessageDiv.className = 'message bot';
      botMessageDiv.innerHTML = `
        <span class="badge badge-tutor">AI Tutor</span>
        <p>Chào bạn! Mình nhận thấy bạn đang xem <b>3 Slide bài giảng</b>. Để giúp bạn nắm chắc kiến thức mà không bị ngợp, <b>bạn đánh giá mức độ hiểu bài hiện tại của mình ở mức nào?</b></p>
        <div style="margin-top: 10px;">
          <button class="btn-level-chat" onclick="selectLevelInChat('coban')">🌱 Cơ bản</button>
          <button class="btn-level-chat" onclick="selectLevelInChat('thongthao')">🌿 Thông thạo</button>
          <button class="btn-level-chat" onclick="selectLevelInChat('nangcao')">🌳 Nâng cao</button>
        </div>
      `;
      chatMessages.appendChild(botMessageDiv);
      scrollToBottom();
    }

    function toggleChat() {
      const chatSection = document.getElementById('chat-section');
      const mainContainer = document.getElementById('main-container');
      const btnToggle = document.getElementById('btn-toggle-chat');

      isMinimized = !isMinimized;

      if (isMinimized) {
        chatSection.classList.add('minimized');
        mainContainer.classList.add('chat-minimized');
        btnToggle.innerText = "[+] Mở rộng";
      } else {
        chatSection.classList.remove('minimized');
        mainContainer.classList.remove('chat-minimized');
        btnToggle.innerText = "[-] Thu nhỏ";
        scrollToBottom();
      }
    }

    async function selectLevelInChat(levelKey) {
      const levelData = knowledgeBase[levelKey];
      const chatMessages = document.getElementById('chat-messages');
      currentLevelKey = levelKey;

      if (tutorSessionId) {
        try {
          await fetch(`${API_BASE_URL}/api/sessions/${tutorSessionId}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({level: levelKey})
          });
        } catch (error) {
          document.getElementById('current-status-display').innerText =
            'Trạng thái: Không cập nhật được mức';
        }
      }

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = `Tôi chọn mức độ: ${levelData.label}`;
      chatMessages.appendChild(userMsg);

      scrollToBottom();

      setTimeout(() => {
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot';
        botMessageDiv.innerHTML = `
          <span class="badge ${levelData.badgeClass}">Mức độ: ${levelData.label}</span>
          <p>Dưới đây là danh sách câu hỏi <b>${levelData.label}</b> và bài Test đánh giá nhanh được thiết kế riêng từ 3 Slide của bạn:</p>
          <div class="suggestions-container">
            ${levelData.questions.map(q => `<button class="btn-suggestion" onclick="askQuestion('${q}', '${levelKey}')">❓ ${q}</button>`).join('')}
            <button class="btn-test-action" onclick="startQuiz('${levelKey}')">📝 Làm bài Test đánh giá năng lực (Mức độ ${levelData.label})</button>
          </div>
        `;
        chatMessages.appendChild(botMessageDiv);
        scrollToBottom();
      }, 400);
    }

    // Khởi động làm bài test trắc nghiệm theo mức độ
    function startQuiz(levelKey) {
      const levelData = knowledgeBase[levelKey];
      const testInfo = levelData.test;
      const chatMessages = document.getElementById('chat-messages');

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = `Làm bài Test đánh giá năng lực (${levelData.label})`;
      chatMessages.appendChild(userMsg);

      scrollToBottom();

      setTimeout(() => {
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot';
        botMessageDiv.innerHTML = `
          <span class="badge badge-test">Bài Test: ${levelData.label}</span>
          <p><b>Câu hỏi:</b> ${testInfo.question}</p>
          <div class="suggestions-container" style="margin-top: 10px;">
            ${testInfo.options.map((opt, idx) => `
              <button class="btn-option" onclick="submitQuizAnswer('${levelKey}', ${idx})">${opt}</button>
            `).join('')}
          </div>
        `;
        chatMessages.appendChild(botMessageDiv);
        scrollToBottom();
      }, 400);
    }

    // Kiểm tra kết quả, chấm điểm, hiển thị nhận xét & link tới Slide cải thiện
    function submitQuizAnswer(levelKey, selectedIdx) {
      const levelData = knowledgeBase[levelKey];
      const testInfo = levelData.test;
      const chatMessages = document.getElementById('chat-messages');

      const isCorrect = (selectedIdx === testInfo.correctIndex);

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = testInfo.options[selectedIdx];
      chatMessages.appendChild(userMsg);

      scrollToBottom();

      setTimeout(() => {
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot';

        let resultHTML = "";

        if (isCorrect) {
          resultHTML = `
            <span class="badge badge-tutor" style="background:#dcfce7; color:#15803d;">Kết quả: 10/10 - Chính xác! 🎉</span>
            <p><b>Nhận xét:</b> Xuất sắc! Bạn đã nắm hoàn toàn chính xác kiến thức trọng tâm của mức độ <b>${levelData.label}</b> trong bài giảng.</p>
            <div style="margin-top: 12px; border-top: 1px dashed #ccc; padding-top: 10px;">
              <p style="font-size: 0.85rem; color: #4b5563; margin-bottom: 8px;">Bạn có thể thử thách bản thân với mức độ cao hơn:</p>
              <div>
                <button class="btn-level-chat" style="font-size:0.8rem; padding:6px 12px;" onclick="selectLevelInChat('thongthao')">🌿 Thông thạo</button>
                <button class="btn-level-chat" style="font-size:0.8rem; padding:6px 12px;" onclick="selectLevelInChat('nangcao')">🌳 Nâng cao</button>
              </div>
            </div>
          `;
        } else {
          resultHTML = `
            <span class="badge badge-test" style="background:#fee2e2; color:#b91c1c;">Kết quả: Chưa chính xác (0/10)</span>
            <p><b>Đáp án đúng là:</b> ${testInfo.options[testInfo.correctIndex]}</p>
            <p style="margin-top: 8px;"><b>Điểm cần cải thiện:</b> ${testInfo.feedbackWrong}</p>
            <div style="margin-top: 12px; background: #fffaf0; border: 1px solid #fed7aa; padding: 10px; border-radius: 8px;">
              <p style="font-size: 0.85rem; font-weight: 600; color: #9a3412; margin-bottom: 6px;">👉 Tài liệu cải thiện:</p>
              <button class="btn-suggestion" style="width:100%; border-color:#ea580c; color:#ea580c; font-weight:600;" onclick="scrollToSlide('${testInfo.slideTarget}')">
                📖 Đọc lại ngay: ${testInfo.slideName}
              </button>
            </div>
          `;
        }

        botMessageDiv.innerHTML = resultHTML;
        chatMessages.appendChild(botMessageDiv);
        scrollToBottom();
      }, 500);
    }

    // Hàm chuyển hướng & làm nổi bật Slide cần ôn tập phía bên trái
    function scrollToSlide(slideId) {
      const slideElem = document.getElementById(slideId);
      if (slideElem) {
        slideElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        // Tạo hiệu ứng chớp sáng để học viên nhận biết ngay Slide cần xem
        document.querySelectorAll('.slide-card').forEach(card => card.classList.remove('highlight'));
        slideElem.classList.add('highlight');

        setTimeout(() => {
          slideElem.classList.remove('highlight');
        }, 3500);
      }
    }

    async function askQuestion(questionText, levelKey = null) {
      document.getElementById('user-input').value = '';
      const chatMessages = document.getElementById('chat-messages');

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = questionText;
      chatMessages.appendChild(userMsg);

      scrollToBottom();

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message bot';
      loadingDiv.innerHTML = '<span class="badge badge-tutor">AI Tutor</span><p>Đang tìm trong slide và soạn câu trả lời...</p>';
      chatMessages.appendChild(loadingDiv);
      scrollToBottom();

      if (!tutorSessionId) await initBackendSession();
      if (!tutorSessionId) {
        loadingDiv.innerHTML = '<span class="badge badge-test">Lỗi kết nối</span><p>Backend chưa chạy. Hãy chạy server rồi thử lại.</p>';
        return;
      }

      try {
        document.getElementById('current-status-display').innerText =
          'Trạng thái: AI đang trả lời...';
        const response = await fetch(`${API_BASE_URL}/api/chat`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            session_id: tutorSessionId,
            message: questionText
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error?.message || `HTTP ${response.status}`);
        }

        const citationsHTML = (data.citations || []).map(item =>
          `<span class="badge badge-tutor">${escapeHTML(item.citation)} · ${escapeHTML(item.document_title)}</span>`
        ).join(' ');
        const suggestionsHTML = (data.suggestions || []).map(question =>
          `<button class="btn-suggestion" data-question="${escapeAttribute(question)}">❓ ${escapeHTML(question)}</button>`
        ).join('');
        const answerLabel = data.answer_type === 'inference'
          ? 'Suy luận từ nguồn'
          : data.status === 'insufficient_source' ? 'Chưa đủ nguồn' : 'AI Tutor';

        loadingDiv.innerHTML = `
          <span class="badge ${knowledgeBase[currentLevelKey].badgeClass}">${answerLabel}</span>
          <p>${escapeHTML(data.answer)}</p>
          ${citationsHTML ? `<div style="margin-top:10px;">${citationsHTML}</div>` : ''}
          ${suggestionsHTML ? `
            <div class="suggestions-container" style="margin-top:15px; border-top:1px dashed #ccc; padding-top:10px;">
              <div class="suggestion-title">Câu hỏi tiếp theo phù hợp mức ${knowledgeBase[currentLevelKey].label}</div>
              ${suggestionsHTML}
            </div>` : ''}
        `;
        loadingDiv.querySelectorAll('[data-question]').forEach(button => {
          button.addEventListener('click', () => askQuestion(button.dataset.question));
        });
        document.getElementById('current-status-display').innerText =
          `Trạng thái: ${data.model || 'AI'} · ${data.status}`;
      } catch (error) {
        loadingDiv.innerHTML = `
          <span class="badge badge-test">Không thể trả lời</span>
          <p>${escapeHTML(error.message)} Bạn có thể thử lại sau.</p>
        `;
        document.getElementById('current-status-display').innerText =
          'Trạng thái: AI tạm thời lỗi';
      }
      scrollToBottom();
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHTML(value).replaceAll('`', '&#096;');
    }

    function sendMessage() {
      const inputField = document.getElementById('user-input');
      const text = inputField.value.trim();
      if (!text) return;

      askQuestion(text);
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function scrollToBottom() {
      const chatMessages = document.getElementById('chat-messages');
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>

</body>
</html>
