<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLearn AI Tutor - Quiz & Improvement Flow</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --primary-color: #0f766e;
      --primary-hover: #115e59;
      --text-color: #1f2937;
      --border-color: #e5e7eb;
      --chat-bg: #ffffff;
      --bot-bg: #f0fdf4;
      --user-bg: #0f766e;
      --user-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 20px;
      width: 100%;
      max-width: 1280px;
      height: 92vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* Column 1: Khu vực Slide có thể cuộn - ĐÃ BỎ TIÊU ĐỀ */
    .doc-section {
      padding: 20px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: #fafbfc;
      height: 100%;
      overflow: hidden;
    }

    .slides-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-right: 10px;
      scroll-behavior: smooth;
    }

    .slide-viewer-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-deck {
      border: 1px solid var(--border-color);
      background: #fff;
      color: #475569;
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-deck.active {
      color: #fff;
      background: var(--primary-color);
      border-color: var(--primary-color);
    }

    .pdf-page-status {
      margin-left: auto;
      color: #64748b;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .pdf-viewer {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: #e2e8f0;
    }

    .citation-link {
      border: 0;
      cursor: pointer;
      margin: 2px 4px 2px 0;
    }

    .citation-link:hover {
      filter: brightness(0.94);
      text-decoration: underline;
    }

    .slide-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: border-color 0.3s, background-color 0.3s;
    }

    .slide-card.highlight {
      border: 2px solid #ea580c;
      background-color: #fffaf0;
    }

    .slide-header {
      font-weight: 700;
      font-size: 1rem;
      color: var(--primary-color);
      border-bottom: 2px solid #f0fdf4;
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slide-number {
      font-size: 0.75rem;
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .slide-content {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #374151;
    }

    .slide-content ul {
      margin-left: 20px;
      margin-top: 8px;
    }

    .slide-content li {
      margin-bottom: 6px;
    }

    /* Column 2: Chat Section */
    .chat-section {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--chat-bg);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .chat-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header span {
      font-size: 0.85rem;
      color: #6b7280;
      font-weight: normal;
    }

    .btn-minimize {
      background: #f3f4f6;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-minimize:hover {
      background: #e5e7eb;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 88%;
      padding: 14px 18px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid #dcfce7;
      border-bottom-left-radius: 2px;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 2px;
    }

    .suggestions-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .suggestion-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-top: 5px;
    }

    .btn-suggestion {
      background: #fff;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 10px 14px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.4;
    }

    .btn-suggestion:hover {
      background: var(--primary-color);
      color: #fff;
    }

    .btn-test-action {
      background: #fff7ed;
      border: 1.5px dashed #ea580c;
      color: #c2410c;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: left;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 5px;
    }

    .btn-test-action:hover {
      background: #ea580c;
      color: #fff;
    }

    .btn-option {
      background: #fff;
      border: 1px solid #cbd5e1;
      color: #1e293b;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-option:hover {
      border-color: var(--primary-color);
      background: #f8fafc;
    }

    .btn-option:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .btn-option:disabled:hover {
      border-color: #cbd5e1;
      background: #fff;
    }

    .btn-level-chat {
      background: #fff;
      border: 1.5px solid var(--primary-color);
      color: var(--primary-color);
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-right: 8px;
      margin-top: 8px;
      display: inline-block;
    }

    .btn-level-chat:hover {
      background: var(--primary-color);
      color: #fff;
    }

    .chat-input-area {
      padding: 15px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      background: #fff;
      flex-shrink: 0;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
    }

    .chat-input-area input:focus {
      border-color: var(--primary-color);
    }

    .btn-send {
      padding: 10px 20px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-send:hover {
      background: var(--primary-hover);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .badge-coban { background: #e0f2fe; color: #0369a1; }
    .badge-thongthao { background: #fef3c7; color: #b45309; }
    .badge-nangcao { background: #f3e8ff; color: #6b21a8; }
    .badge-tutor { background: #dcfce7; color: #15803d; }
    .badge-test { background: #ffedd5; color: #9a3412; }

    /* STATE: Thu nhỏ chat bot */
    .chat-section.minimized {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 280px;
      height: 55px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      border: 1px solid var(--border-color);
      z-index: 100;
    }

    .chat-section.minimized .chat-messages,
    .chat-section.minimized .chat-input-area {
      display: none;
    }

    .container.chat-minimized {
      grid-template-columns: 1fr;
    }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    <!-- KHU VỰC 1: SLIDE BÀI HỌC (3 SLIDE CÓ THỂ CUỘN - KHÔNG CÓ TIÊU ĐỀ) -->
    <div class="doc-section">
      <div class="slide-viewer-toolbar">
        <button class="btn-deck active" data-document-id="D1">Day 1 · AI & LLM Foundation</button>
        <button class="btn-deck" data-document-id="D2">Day 2 · Xác định bài toán</button>
        <span class="pdf-page-status" id="pdf-page-status">Day 1 · Trang 1 / 29</span>
      </div>
      <iframe
        class="pdf-viewer"
        id="pdf-viewer"
        title="Slide bài giảng VLearn"
        src="data/vlearn-pack/slides/d1-slide-hackathon.pdf#page=1&view=FitH"
      ></iframe>
    </div>

    <!-- KHU VỰC 2: KHUNG CHAT AI TUTOR -->
    <div class="chat-section" id="chat-section">
      <div class="chat-header">
        <div>VLearn AI Tutor</div>
        <div class="chat-header-actions">
          <span id="current-status-display">Trạng thái: Sẵn sàng</span>
          <button class="btn-minimize" id="btn-toggle-chat" onclick="toggleChat()">[-] Thu nhỏ</button>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <!-- AI sẽ tự gởi lời chào và khảo sát mức độ ngay lúc mở trang -->
      </div>

      <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="Gõ câu hỏi của bạn tại đây..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="sendMessage()">Gửi</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:8000';
    let tutorSessionId = null;
    let currentLevelKey = 'coban';

    // Câu hỏi gợi ý và ngân hàng quiz theo từng mức độ.
    const knowledgeBase = {
      coban: {
        badgeClass: "badge-coban",
        label: "Cơ bản",
        questions: [
          "AI, Machine Learning, Deep Learning, GenAI và LLM khác nhau thế nào?",

        ],
        answers: {},
        tests: [
          {
            question: "Theo Day 1, LLM nằm ở đâu trong hệ các khái niệm AI?",
            options: [
              "A. LLM là chiếc ô lớn nhất bao trùm toàn bộ AI",
              "B. LLM là model nền chuyên ngôn ngữ thuộc Generative AI",

          },
          {

            options: [
              "A. Luôn là một từ hoàn chỉnh",

            correctIndex: 1,

          {

            options: [

          {
            question: "Một problem statement tốt có nên chứa sẵn tên giải pháp không?",
            options: [

              "B. Không, nó mô tả vấn đề cụ thể cần giải quyết",

            ],
            correctIndex: 1,
            slideTarget: "slide-D2-9",
            slideName: "Day 2 · Trang 9: Bài toán một câu",
            feedbackWrong: "Problem statement tập trung vào vấn đề, người dùng và kết quả; không nhét sẵn giải pháp."

        ]
      },
      thongthao: {
        badgeClass: "badge-thongthao",
        label: "Thông thạo",
        questions: [
          "Context và attention giữ vai trò gì khi LLM xử lý câu hỏi?",
          "Từ LLM đến agent có những mức năng lực nào?",
          "Baseline, target và measurement liên hệ với nhau thế nào?"
        ],
        answers: {},
        tests: [
          {
            question: "Điểm khác biệt cốt lõi khi chuyển từ LLM sang agent là gì?",

              "A. Chỉ đổi màu giao diện",

              "D. Agent luôn đúng"
            ],
            correctIndex: 1,
            slideTarget: "slide-D1-23",
            slideName: "Day 1 · Trang 23: Từ LLM đến agent",
            feedbackWrong: "Agent bổ sung khả năng hành động, công cụ, trạng thái và vòng lặp; không có nghĩa agent luôn đúng."
          },
          {
            question: "Attention giúp model làm gì?",
            options: [
              "A. Mỗi token nhìn sang các token liên quan trong context",
              "B. Tăng dung lượng ổ cứng",

            ],
            correctIndex: 0,
            slideTarget: "slide-D1-15",
            slideName: "Day 1 · Trang 15: Attention",
            feedbackWrong: "Attention giúp mỗi token tập trung vào những token quan trọng khác trong ngữ cảnh."
          },
          {
            question: "Baseline, target và measurement dùng để làm gì?",
            options: [
              "A. Định lượng hiện trạng, mục tiêu và cách biết đã cải thiện",

            slideName: "Day 2 · Trang 11: Baseline, Target, Measurement",
            feedbackWrong: "Baseline mô tả hiện trạng, target là ngưỡng cần đạt và measurement là cách chứng minh kết quả."
          },
          {
            question: "Theo cây quyết định giải pháp, nên ưu tiên cấp độ nào?",

            correctIndex: 1,

      },
      nangcao: {
        badgeClass: "badge-nangcao",
        label: "Nâng cao",
        questions: [
          "Khi nào automate hoàn toàn rủi ro hơn augment?",

          "Temperature và top_p tạo ra những đánh đổi nào?"
        ],
        answers: {},
        tests: [
          {
            question: "Khi sai sót có hậu quả cao, mức automation phù hợp nhất là gì?",

              "A. Automate mọi trường hợp",

              "D. Bỏ bước đo lường"
            ],
            correctIndex: 1,
            slideTarget: "slide-D2-17",
            slideName: "Day 2 · Trang 17: Automate và Augment",
            feedbackWrong: "Cost-of-error cao đòi hỏi giữ quyền quyết định hoặc điểm kiểm soát cho con người."
          },
          {
            question: "Temperature cao thường tạo đánh đổi nào?",
            options: [
              "A. Ổn định hơn và luôn lặp lại",
              "B. Đa dạng hơn nhưng dễ lệch khỏi lựa chọn chắc chắn",

              "D. Luôn làm câu trả lời đúng hơn"

            correctIndex: 1,
            slideTarget: "slide-D1-29",
            slideName: "Day 1 · Trang 29: Temperature và top_p",
            feedbackWrong: "Temperature cao làm phân bố phẳng hơn, tăng đa dạng nhưng cũng tăng rủi ro chọn token kém chắc chắn."

          {
            question: "Vì sao không nên chọn model chỉ theo tên?",

              "A. Vì mọi model hoàn toàn giống nhau",

              "D. Vì chỉ context window quan trọng"
            ],
            correctIndex: 1,
            slideTarget: "slide-D1-26",
            slideName: "Day 1 · Trang 26: Chọn model theo tầng",
            feedbackWrong: "Tên model không đủ để ra quyết định; cần khớp tầng năng lực, chi phí và yêu cầu chất lượng."
          },
          {
            question: "Vì sao output token cần được kiểm soát chặt?",
            options: [
              "A. Output luôn miễn phí",
              "B. Vé ra thường đắt hơn vé vào và output dài làm tăng cost/latency",
              "C. Output không tính token",
              "D. Chỉ input ảnh hưởng chi phí"
            ],
            correctIndex: 1,
            slideTarget: "slide-D1-27",
            slideName: "Day 1 · Trang 27: Token có giá",
            feedbackWrong: "Output token thường đắt hơn input token; câu trả lời dài không cần thiết làm tăng cả cost và latency."
          }
        ]
      }
    };

    const quizState = Object.fromEntries(
      Object.keys(knowledgeBase).map(levelKey => [
        levelKey,
        {queue: [], lastIndex: null, cycle: 0}
      ])
    );

    let isMinimized = false;

    window.onload = async function() {
      initChatTutor();
      initSlideViewer();
      await initBackendSession();
    };

    const slideDocuments = {
      D1: {
        name: 'Day 1',
        pages: 29,
        url: 'data/vlearn-pack/slides/d1-slide-hackathon.pdf'
      },
      D2: {
        name: 'Day 2',
        pages: 29,
        url: 'data/vlearn-pack/slides/d2-slide-hackathon.pdf'
      }
    };

    function initSlideViewer() {
      document.querySelectorAll('[data-document-id]').forEach(button => {
        button.addEventListener('click', () => {
          openPdfPage(button.dataset.documentId, 1);
        });
      });
    }

    function openPdfPage(documentId, page = 1) {
      const documentInfo = slideDocuments[documentId];
      if (!documentInfo) return;
      const safePage = Math.max(1, Math.min(Number(page) || 1, documentInfo.pages));
      document.getElementById('pdf-viewer').src =
        `${documentInfo.url}#page=${safePage}&view=FitH`;
      document.getElementById('pdf-page-status').innerText =
        `${documentInfo.name} · Trang ${safePage} / ${documentInfo.pages}`;
      document.querySelectorAll('[data-document-id]').forEach(button => {
        button.classList.toggle(
          'active',
          button.dataset.documentId === documentId
        );
      });
    }

    async function initBackendSession() {
      const status = document.getElementById('current-status-display');
      status.innerText = 'Trạng thái: Đang kết nối AI...';
      try {
        const response = await fetch(`${API_BASE_URL}/api/sessions`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({initial_level: currentLevelKey})
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        tutorSessionId = data.session.session_id;
        status.innerText = 'Trạng thái: AI sẵn sàng';
      } catch (error) {
        status.innerText = 'Trạng thái: Chưa kết nối backend';
      }
    }

    function initChatTutor() {
      const chatMessages = document.getElementById('chat-messages');
      const botMessageDiv = document.createElement('div');
      botMessageDiv.className = 'message bot';
      botMessageDiv.innerHTML = `
        <span class="badge badge-tutor">AI Tutor</span>
        <p>Chào bạn! Mình có thể hỗ trợ bạn học từ <b>2 bộ slide Day 1 và Day 2</b>. Để giúp bạn nắm chắc kiến thức mà không bị ngợp, <b>bạn đánh giá mức độ hiểu bài hiện tại của mình ở mức nào?</b></p>
        <div style="margin-top: 10px;">
          <button class="btn-level-chat" onclick="selectLevelInChat('coban')">🌱 Cơ bản</button>
          <button class="btn-level-chat" onclick="selectLevelInChat('thongthao')">🌿 Thông thạo</button>
          <button class="btn-level-chat" onclick="selectLevelInChat('nangcao')">🌳 Nâng cao</button>
        </div>
      `;
      chatMessages.appendChild(botMessageDiv);
      scrollToBottom();
    }

    function toggleChat() {
      const chatSection = document.getElementById('chat-section');
      const mainContainer = document.getElementById('main-container');
      const btnToggle = document.getElementById('btn-toggle-chat');

      isMinimized = !isMinimized;

      if (isMinimized) {
        chatSection.classList.add('minimized');
        mainContainer.classList.add('chat-minimized');
        btnToggle.innerText = "[+] Mở rộng";
      } else {
        chatSection.classList.remove('minimized');
        mainContainer.classList.remove('chat-minimized');
        btnToggle.innerText = "[-] Thu nhỏ";
        scrollToBottom();
      }
    }

    async function selectLevelInChat(levelKey) {
      const levelData = knowledgeBase[levelKey];
      const chatMessages = document.getElementById('chat-messages');
      currentLevelKey = levelKey;

      if (tutorSessionId) {
        try {
          await fetch(`${API_BASE_URL}/api/sessions/${tutorSessionId}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({level: levelKey})
          });
        } catch (error) {
          document.getElementById('current-status-display').innerText =
            'Trạng thái: Không cập nhật được mức';
        }
      }

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = `Tôi chọn mức độ: ${levelData.label}`;
      chatMessages.appendChild(userMsg);

      scrollToBottom();

      setTimeout(() => {
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot';
        botMessageDiv.innerHTML = `
          <span class="badge ${levelData.badgeClass}">Mức độ: ${levelData.label}</span>
          <p>Dưới đây là câu hỏi gợi ý <b>${levelData.label}</b> và ngân hàng Test từ hai bộ slide Day 1/Day 2:</p>
          <div class="suggestions-container">
            ${levelData.questions.map(q => `<button class="btn-suggestion" onclick="askQuestion('${q}', '${levelKey}')">❓ ${q}</button>`).join('')}
            <button class="btn-test-action" onclick="startQuiz('${levelKey}')">📝 Làm bài Test đánh giá năng lực (Mức độ ${levelData.label})</button>
          </div>
        `;
        chatMessages.appendChild(botMessageDiv);
        scrollToBottom();
      }, 400);
    }

    // Khởi động làm bài test trắc nghiệm theo mức độ
    function startQuiz(levelKey) {
      const levelData = knowledgeBase[levelKey];
      const testIndex = getNextQuizIndex(levelKey);
      const testInfo = levelData.tests[testIndex];
      const state = quizState[levelKey];
      const position = levelData.tests.length - state.queue.length;
      const chatMessages = document.getElementById('chat-messages');

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = `Làm bài Test đánh giá năng lực (${levelData.label})`;
      chatMessages.appendChild(userMsg);

      scrollToBottom();

      setTimeout(() => {
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot';
        botMessageDiv.innerHTML = `
          <span class="badge badge-test">Bài Test: ${levelData.label}</span>
          <p style="font-size:0.82rem; color:#64748b;">Vòng ${state.cycle} · Câu ${position}/${levelData.tests.length}</p>
          <p><b>Câu hỏi:</b> ${testInfo.question}</p>
          <div class="suggestions-container" style="margin-top: 10px;">
            ${testInfo.options.map((opt, idx) => `
              <button class="btn-option" onclick="submitQuizAnswer('${levelKey}', ${testIndex}, ${idx}, this)">${opt}</button>
            `).join('')}
          </div>
        `;
        chatMessages.appendChild(botMessageDiv);
        scrollToBottom();
      }, 400);
    }

    function getNextQuizIndex(levelKey) {
      const tests = knowledgeBase[levelKey].tests;
      const state = quizState[levelKey];
      if (state.queue.length === 0) {
        state.queue = tests.map((_, index) => index);
        for (let index = state.queue.length - 1; index > 0; index--) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [state.queue[index], state.queue[randomIndex]] =
            [state.queue[randomIndex], state.queue[index]];
        }
        if (
          state.queue.length > 1 &&
          state.queue[0] === state.lastIndex
        ) {
          [state.queue[0], state.queue[1]] = [state.queue[1], state.queue[0]];
        }
        state.cycle += 1;
      }
      const nextIndex = state.queue.shift();
      state.lastIndex = nextIndex;
      return nextIndex;
    }

    function buildPostQuizActions(levelKey) {
      const levelData = knowledgeBase[levelKey];
      return `
        <div class="suggestions-container" style="margin-top:15px; border-top:1px dashed #ccc; padding-top:10px;">
          <div class="suggestion-title">Gợi ý câu hỏi để học tiếp</div>
          ${levelData.questions.map(question => `
            <button class="btn-suggestion" onclick="askQuestion('${question}', '${levelKey}')">❓ ${question}</button>
          `).join('')}
          <button class="btn-test-action" onclick="startQuiz('${levelKey}')">
            📝 Làm câu Test tiếp theo · không lặp trong cùng vòng
          </button>
        </div>
      `;
    }

    // Kiểm tra kết quả, chấm điểm, hiển thị nhận xét & link tới Slide cải thiện
    function submitQuizAnswer(levelKey, testIndex, selectedIdx, selectedButton) {
      const levelData = knowledgeBase[levelKey];
      const testInfo = levelData.tests[testIndex];
      const chatMessages = document.getElementById('chat-messages');

      const isCorrect = (selectedIdx === testInfo.correctIndex);
      selectedButton.closest('.suggestions-container')
        .querySelectorAll('.btn-option')
        .forEach(button => button.disabled = true);

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = testInfo.options[selectedIdx];
      chatMessages.appendChild(userMsg);

      scrollToBottom();

      setTimeout(() => {
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot';

        let resultHTML = "";

        if (isCorrect) {
          resultHTML = `
            <span class="badge badge-tutor" style="background:#dcfce7; color:#15803d;">Kết quả: 10/10 - Chính xác! 🎉</span>
            <p><b>Nhận xét:</b> Chính xác. Bạn có thể hỏi sâu hơn hoặc làm câu test tiếp theo ở mức <b>${levelData.label}</b>.</p>
            ${buildPostQuizActions(levelKey)}
          `;
        } else {
          resultHTML = `
            <span class="badge badge-test" style="background:#fee2e2; color:#b91c1c;">Kết quả: Chưa chính xác (0/10)</span>
            <p><b>Đáp án đúng là:</b> ${testInfo.options[testInfo.correctIndex]}</p>
            <p style="margin-top: 8px;"><b>Điểm cần cải thiện:</b> ${testInfo.feedbackWrong}</p>
            <div style="margin-top: 12px; background: #fffaf0; border: 1px solid #fed7aa; padding: 10px; border-radius: 8px;">
              <p style="font-size: 0.85rem; font-weight: 600; color: #9a3412; margin-bottom: 6px;">👉 Tài liệu cải thiện:</p>
              <button class="btn-suggestion" style="width:100%; border-color:#ea580c; color:#ea580c; font-weight:600;" onclick="scrollToSlide('${testInfo.slideTarget}')">
                📖 Đọc lại ngay: ${testInfo.slideName}
              </button>
            </div>
            ${buildPostQuizActions(levelKey)}
          `;
        }

        botMessageDiv.innerHTML = resultHTML;
        chatMessages.appendChild(botMessageDiv);
        scrollToBottom();
      }, 500);
    }

    // Hàm chuyển hướng & làm nổi bật Slide cần ôn tập phía bên trái
    function scrollToSlide(slideId) {
      const pdfTarget = /^slide-(D[12])-(\d+)$/.exec(slideId);
      if (pdfTarget) {
        openPdfPage(pdfTarget[1], Number(pdfTarget[2]));
        return;
      }
      const slideElem = document.getElementById(slideId);
      if (slideElem) {
        slideElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        // Tạo hiệu ứng chớp sáng để học viên nhận biết ngay Slide cần xem
        document.querySelectorAll('.slide-card').forEach(card => card.classList.remove('highlight'));
        slideElem.classList.add('highlight');

        setTimeout(() => {
          slideElem.classList.remove('highlight');
        }, 3500);
      }
    }

    async function askQuestion(questionText, levelKey = null) {
      document.getElementById('user-input').value = '';
      const chatMessages = document.getElementById('chat-messages');

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = questionText;
      chatMessages.appendChild(userMsg);

      scrollToBottom();

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message bot';
      loadingDiv.innerHTML = '<span class="badge badge-tutor">AI Tutor</span><p>Đang tìm trong slide và soạn câu trả lời...</p>';
      chatMessages.appendChild(loadingDiv);
      scrollToBottom();

      if (!tutorSessionId) await initBackendSession();
      if (!tutorSessionId) {
        loadingDiv.innerHTML = '<span class="badge badge-test">Lỗi kết nối</span><p>Backend chưa chạy. Hãy chạy server rồi thử lại.</p>';
        return;
      }

      try {
        document.getElementById('current-status-display').innerText =
          'Trạng thái: AI đang trả lời...';
        const response = await fetch(`${API_BASE_URL}/api/chat`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            session_id: tutorSessionId,
            message: questionText
          })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error?.message || `HTTP ${response.status}`);
        }

        const citationsHTML = (data.citations || []).map(item =>
          `<button class="badge badge-tutor citation-link"
             data-citation-document="${escapeAttribute(item.chunk_id.split('-')[0])}"
             data-citation-page="${Number(item.page)}">
             ${escapeHTML(item.citation)} · ${escapeHTML(item.document_title)}
           </button>`
        ).join(' ');
        const suggestionsHTML = (data.suggestions || []).map(question =>
          `<button class="btn-suggestion" data-question="${escapeAttribute(question)}">❓ ${escapeHTML(question)}</button>`
        ).join('');
        const answerLabel = data.answer_type === 'inference'
          ? 'Suy luận từ nguồn'
          : data.status === 'insufficient_source' ? 'Chưa đủ nguồn' : 'AI Tutor';

        loadingDiv.innerHTML = `
          <span class="badge ${knowledgeBase[currentLevelKey].badgeClass}">${answerLabel}</span>
          <p>${escapeHTML(data.answer)}</p>
          ${citationsHTML ? `<div style="margin-top:10px;">${citationsHTML}</div>` : ''}
          ${suggestionsHTML ? `
            <div class="suggestions-container" style="margin-top:15px; border-top:1px dashed #ccc; padding-top:10px;">
              <div class="suggestion-title">Câu hỏi tiếp theo phù hợp mức ${knowledgeBase[currentLevelKey].label}</div>
              ${suggestionsHTML}
              <button class="btn-test-action" data-start-quiz="${currentLevelKey}">
                📝 Làm bài Test trắc nghiệm mức ${knowledgeBase[currentLevelKey].label}
              </button>
            </div>` : ''}
        `;
        loadingDiv.querySelectorAll('[data-question]').forEach(button => {
          button.addEventListener('click', () => askQuestion(button.dataset.question));
        });
        loadingDiv.querySelectorAll('[data-start-quiz]').forEach(button => {
          button.addEventListener('click', () => startQuiz(button.dataset.startQuiz));
        });
        loadingDiv.querySelectorAll('[data-citation-document]').forEach(button => {
          button.addEventListener('click', () => {
            openPdfPage(
              button.dataset.citationDocument,
              Number(button.dataset.citationPage)
            );
          });
        });
        document.getElementById('current-status-display').innerText =
          `Trạng thái: ${data.model || 'AI'} · ${data.status}`;
      } catch (error) {
        loadingDiv.innerHTML = `
          <span class="badge badge-test">Không thể trả lời</span>
          <p>${escapeHTML(error.message)} Bạn có thể thử lại sau.</p>
        `;
        document.getElementById('current-status-display').innerText =
          'Trạng thái: AI tạm thời lỗi';
      }
      scrollToBottom();
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHTML(value).replaceAll('`', '&#096;');
    }

    function sendMessage() {
      const inputField = document.getElementById('user-input');
      const text = inputField.value.trim();
      if (!text) return;

      askQuestion(text);
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function scrollToBottom() {
      const chatMessages = document.getElementById('chat-messages');
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>

</body>
